plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.twenty48.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.twenty48.app"
        minSdk 24
        targetSdk 34
        // versionCode/versionName come from Gradle properties so CI can bump
        // them monotonically (-PversionCode=<run#>). Fallbacks are for local
        // builds.
        versionCode = (project.findProperty("versionCode") ?: "1").toString().toInteger()
        versionName = (project.findProperty("versionName") ?: "1.0").toString()
    }

    // Stable debug signing key committed to the repo so every CI build shares a
    // signature and phones can update in place (an ad-hoc random debug key
    // would cause "signatures do not match" on update).
    signingConfigs {
        debugStable {
            storeFile file("twenty48-debug.keystore")
            storePassword "twenty48"
            keyAlias "twenty48"
            keyPassword "twenty48"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugStable
        }
        release {
            signingConfig signingConfigs.debugStable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
