name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin Gradle 8.4 here so the `gradle` command on PATH IS 8.4 — do not
      # rely on the runner's preinstalled Gradle (currently 9.x), which breaks
      # AGP 8.1.4 and the injected Develocity init script.
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshchat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
